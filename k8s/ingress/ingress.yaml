apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cloudvault
  namespace: cloudvault
spec:
  ingressClassName: nginx
  rules:
    - host: cloudvault.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend
                port:
                  number: 8501
